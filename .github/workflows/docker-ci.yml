name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint
        run: |
          ruff backend/

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: docker build -t lakshand44/rag-backend:latest ./backend

      - name: Build Streamlit Image
        run: docker build -t lakshand44/rag-streamlit:latest ./ui

      - name: Build React Image
        run: docker build -t lakshand44/rag-react:latest ./document-ai-ui

      - name: Push Backend Image
        run: docker push lakshand44/rag-backend:latest

      - name: Push Streamlit Image
        run: docker push lakshand44/rag-streamlit:latest

      - name: Push React Image
        run: docker push lakshand44/rag-react:latest